name: Release candidate

on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  windows:

    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        versions:
          - osarch: "windows-x86_64"
            arch: "x64"
            # --enable-tests makes the solver choose the same dependencies
            # as CI, whose store is shared.  It doesn't build the test suites,
            # since pandoc-cli is the only target.
            cabal_opts: '--enable-tests -fembed_data_files -fserver -flua'

    steps:
    - uses: actions/checkout@v7
    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.18.2.0

    # declare/restore cached things

    - name: Update cabal and compute cache keys
      id:   cabal-keys
      uses: ./.github/actions/cabal-cache-key

    # Shares the store saved by the CI windows job, so nothing is saved here.
    - name: Restore cabal store
      id:   cabal-global
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-keys.outputs.store-key }}
        restore-keys: |
          ${{ steps.cabal-keys.outputs.store-restore-key }}

    - name: Install dependencies
      run: |
          cabal build ${{ matrix.versions.cabal_opts }} --dependencies-only pandoc-cli

    - name: Create windows package
      shell: cmd
      run: |
          for /f %%a in ('powershell -Command "Get-Date -format yyyy-MM-dd"') do set THEDATE=%%a
          cabal freeze ${{ matrix.versions.cabal_opts }}
          type cabal.project.freeze
          cabal build ${{ matrix.versions.cabal_opts }} pandoc-cli
          for /f "delims=" %%a in ('cabal list-bin ${{ matrix.versions.cabal_opts }} pandoc-cli') do set BINPATH=%%a
          echo BINPATH is %BINPATH%
          for /f "tokens=1-2 delims= " %%a in ('cabal run ${{ matrix.versions.cabal_opts }} pandoc-cli -- --version') do (
            @set VERSION=%%b
            goto :next
            )
          :next
          if "%VERSION%" == "" (
            echo Error: could not determine version number.
            exit /b 1
          )
          echo Detected version %VERSION%
          @set WINDOWS=%CD%\windows
          @set RELEASE=%WINDOWS%\pandoc-%VERSION%
          mkdir %RELEASE%
          copy %BINPATH% %RELEASE%
          %BINPATH% -s --toc MANUAL.txt -o %RELEASE%\MANUAL.html
          %BINPATH% -s COPYING.md -t rtf -o %RELEASE%\COPYING.rtf
          copy %RELEASE%\COPYING.rtf %WINDOWS%
          copy COPYRIGHT %RELEASE%\COPYRIGHT.txt
          cd windows
          echo Creating msi...
          dir
          @set WIXBIN="c:\Program Files (x86)\WiX Toolset v3.14\bin"
          @set WORKDIR=%CD%
          echo Running candle...
          %WIXBIN%\candle -arch ${{ matrix.versions.arch }} -dVERSION=%VERSION% -dBINPATH=%RELEASE% *.wxs -out wixobj\
          if %errorlevel% neq 0 exit /b %errorlevel%
          echo Running light...
          %WIXBIN%\light -sw1076 -ext WixUIExtension -ext WixUtilExtension -cultures:en-us -loc Pandoc-en-us.wxl -out %WORKDIR%\pandoc-%VERSION%-${{ matrix.versions.osarch }}.msi wixobj\*.wixobj
          7z a "pandoc-%VERSION%-${{ matrix.versions.osarch }}.zip" pandoc-%VERSION%
          cd ..
          mkdir windows-release-candidate
          copy windows\pandoc-%VERSION%-${{ matrix.versions.osarch }}.msi windows-release-candidate
          copy windows\pandoc-%VERSION%-${{ matrix.versions.osarch }}.zip windows-release-candidate
    - name: Upload unsigned artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-release-candidate-unsigned
        path: windows-release-candidate

  windows-sign:
    needs: windows
    uses: ./.github/workflows/sign-windows.yml
    secrets: inherit

  macos:

    runs-on: macos-15-intel

    steps:
    - uses: actions/checkout@v7

    - name: Install ghcup
      run: |
        brew install ghcup

    - name: Install ghc and cabal
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.18.2.0
        echo "$HOME/.ghcup/bin" >> "${GITHUB_PATH}"

    - name: Update cabal and compute cache keys
      id:   cabal-keys
      uses: ./.github/actions/cabal-cache-key

    # CI doesn't run on macOS, so this job saves its own store.
    - name: Restore cabal store
      id:   cabal-global
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-keys.outputs.store-key }}
        restore-keys: |
          ${{ steps.cabal-keys.outputs.store-restore-key }}

    - name: Create release
      run: |
        sh macos/make_macos_release.sh
        zip -r macos-x86_64.zip macos-x86_64

    - uses: actions/upload-artifact@v7
      with:
        name: macos-x86_64.zip
        path: macos-x86_64.zip

    - name: Save cabal store
      if: steps.cabal-global.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-global.outputs.cache-primary-key }}

