name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '53 7 * * *'

permissions:
  contents: read

jobs:
  linux:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.18.2.0

    - name: Update cabal and compute cache keys
      id:   cabal-keys
      uses: ./.github/actions/cabal-cache-key

    # Shares the store saved by the CI job for this ghc, so nothing is saved
    # here.  --enable-tests makes the solver choose the same dependencies as CI.
    - name: Restore cabal store
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-keys.outputs.store-key }}
        restore-keys: |
          ${{ steps.cabal-keys.outputs.store-restore-key }}

    - name: Install dependencies
      run: |
          ghc --version
          cabal --version
          cabal build --dependencies-only --enable-tests -fembed_data_files -fnightly pandoc-cli
    - name: Build and install artifact
      run: |
          export ARTIFACTS=nightly-linux/pandoc-nightly-linux-$(date +%Y-%m-%d)
          mkdir -p ${ARTIFACTS}
          cabal build --enable-tests -fembed_data_files -fnightly pandoc-cli
          cp "$(cabal list-bin --enable-tests -fembed_data_files -fnightly pandoc-cli)" "${ARTIFACTS}/pandoc"
          strip "${ARTIFACTS}/pandoc"
          cp COPYRIGHT ${ARTIFACTS}/
          echo "Built from ${GITHUB_SHA}" > ${ARTIFACTS}/README.nightly.txt
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-linux
        path: nightly-linux

  windows:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.18.2.0

    - name: Update cabal and compute cache keys
      id:   cabal-keys
      uses: ./.github/actions/cabal-cache-key

    # Shares the store saved by the CI windows job, so nothing is saved here.
    - name: Restore cabal store
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-keys.outputs.store-key }}
        restore-keys: |
          ${{ steps.cabal-keys.outputs.store-restore-key }}

    - name: Install dependencies
      run: |
          cabal build --dependencies-only --enable-tests -fembed_data_files -fnightly pandoc-cli
    - name: Build artifacts
      shell: cmd
      run: |
          for /f %%a in ('powershell -Command "Get-Date -format yyyy-MM-dd"') do set THEDATE=%%a
          set ARTIFACTS=%CD%\nightly-windows\pandoc-nightly-windows-%THEDATE%
          mkdir %ARTIFACTS%
          cabal build --enable-tests -fnightly -fembed_data_files pandoc-cli
          for /f "delims=" %%a in ('cabal list-bin --enable-tests -fnightly -fembed_data_files pandoc-cli') do set BINPATH=%%a
          copy %BINPATH% %ARTIFACTS%
          strip %ARTIFACTS%/pandoc
          copy COPYRIGHT %ARTIFACTS%
          ren %ARTIFACTS%\COPYRIGHT COPYRIGHT.txt
          echo Built from %GITHUB_SHA% > %ARTIFACTS%\README.nightly.txt
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-windows
        path: nightly-windows

  macos:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7
    - name: Install ghcup
      run: |
        brew install ghcup
    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.18.2.0
        echo "$HOME/.ghcup/bin" >> "${GITHUB_PATH}"

    - name: Update cabal and compute cache keys
      id:   cabal-keys
      uses: ./.github/actions/cabal-cache-key

    # CI doesn't run on macOS, so this job saves its own store.
    - name: Restore cabal store
      id:   cabal-global
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-keys.outputs.store-key }}
        restore-keys: |
          ${{ steps.cabal-keys.outputs.store-restore-key }}

    - name: Install dependencies
      run: |
          cabal build --dependencies-only --enable-tests -fnightly -fembed_data_files pandoc-cli
    - name: Build artifacts
      run: |
          export ARTIFACTS=nightly-macos/pandoc-nightly-macos-$(date +%Y-%m-%d)
          mkdir -p ${ARTIFACTS}
          cabal build --enable-tests -fnightly -fembed_data_files pandoc-cli
          cp "$(cabal list-bin --enable-tests -fnightly -fembed_data_files pandoc-cli)" "${ARTIFACTS}/pandoc"
          strip "${ARTIFACTS}/pandoc"
          cp COPYRIGHT ${ARTIFACTS}/
          echo "Built from ${GITHUB_SHA}" > ${ARTIFACTS}/README.nightly.txt
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-macos
        path: nightly-macos

    - name: Save cabal store
      if: steps.cabal-global.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.cabal-keys.outputs.store-dir }}
        key: ${{ steps.cabal-global.outputs.cache-primary-key }}

