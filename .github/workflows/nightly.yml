name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '53 7 * * *'

permissions:
  contents: read

jobs:
  linux:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.14

    # cabal update also writes a default config file if there is none;
    # without one, cabal path prints a notice on stdout.  -z (ignore the
    # project) keeps cabal path from checking out source-repository-packages,
    # which prints git output on stdout too.
    - name: Update cabal and get store path
      id:   cabal-store
      run: |
          cabal update
          echo "dir=$(cabal path -z --store-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache cabal global package db
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cabal-store.outputs.dir }}
        key: ${{ runner.os }}-nightly-9.10-3.14-cabal-global-${{ secrets.CACHE_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-nightly-9.10-3.14-cabal-global-${{ secrets.CACHE_VERSION }}-

    - name: Install dependencies
      run: |
          ghc --version
          cabal --version
          cabal build --dependencies-only -fembed_data_files -fnightly pandoc-cli
    - name: Build and install artifact
      run: |
          export ARTIFACTS=nightly-linux/pandoc-nightly-linux-$(date +%Y-%m-%d)
          mkdir -p ${ARTIFACTS}
          cabal install --installdir="${ARTIFACTS}" --install-method=copy -fembed_data_files -fnightly pandoc-cli
          strip "${ARTIFACTS}/pandoc"
          cp COPYRIGHT ${ARTIFACTS}/
          echo "Built from ${GITHUB_SHA}" > ${ARTIFACTS}/README.nightly.txt
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-linux
        path: nightly-linux

  windows:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.14
    # cabal update also writes a default config file if there is none;
    # without one, cabal path prints a notice on stdout.  -z (ignore the
    # project) keeps cabal path from checking out source-repository-packages,
    # which prints git output on stdout too.
    - name: Update cabal and get store path
      id:   cabal-store
      shell: bash
      run: |
          cabal update
          echo "dir=$(cabal path -z --store-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache cabal global package db
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cabal-store.outputs.dir }}
        key: ${{ runner.os }}-nightly-9.10-3.14-cabal-global-${{ secrets.CACHE_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-nightly-9.10-3.14-cabal-global-${{ secrets.CACHE_VERSION }}-

    - name: Install dependencies
      run: |
          cabal build --dependencies-only -fembed_data_files -fnightly pandoc-cli
    - name: Build artifacts
      shell: cmd
      run: |
          for /f %%a in ('powershell -Command "Get-Date -format yyyy-MM-dd"') do set THEDATE=%%a
          set ARTIFACTS=%CD%\nightly-windows\pandoc-nightly-windows-%THEDATE%
          mkdir %ARTIFACTS%
          cabal install --install-method=copy --installdir=%ARTIFACTS% -fnightly -fembed_data_files pandoc-cli
          strip %ARTIFACTS%/pandoc
          copy COPYRIGHT %ARTIFACTS%
          ren %ARTIFACTS%\COPYRIGHT COPYRIGHT.txt
          echo Built from %GITHUB_SHA% > %ARTIFACTS%\README.nightly.txt
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-windows
        path: nightly-windows

  macos:

    runs-on: macos-26

    # The runner's Command Line Tools ship the macOS 27 SDK, whose .tbd
    # files the default Xcode's (26.x) linker can't parse.  Use the
    # default Xcode's toolchain and SDK consistently.
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
    - uses: actions/checkout@v7
    - name: Select SDK
      run: |
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
        xcrun --sdk macosx --show-sdk-path
        xcrun --find ld
        ld -v
    - name: Install ghcup
      run: |
        brew install ghcup
    - name: Install ghc
      run: |
        ghcup install ghc --set 9.10
        ghcup install cabal --set 3.14
        echo "$HOME/.ghcup/bin" >> "${GITHUB_PATH}"
    # cabal update also writes a default config file if there is none;
    # without one, cabal path prints a notice on stdout.  -z (ignore the
    # project) keeps cabal path from checking out source-repository-packages,
    # which prints git output on stdout too.
    - name: Update cabal and get store path
      id:   cabal-store
      run: |
          cabal update
          echo "dir=$(cabal path -z --store-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache cabal global package db
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cabal-store.outputs.dir }}
        key: ${{ runner.os }}-nightly-9.10-3.14-cabal-global-${{ secrets.CACHE_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-nightly-9.10-3.14-cabal-global-${{ secrets.CACHE_VERSION }}-

    - name: Install dependencies
      run: |
          cabal build --dependencies-only -fnightly -fembed_data_files -fhttp pandoc-cli
    - name: Build artifacts
      run: |
          export ARTIFACTS=nightly-macos/pandoc-nightly-macos-$(date +%Y-%m-%d)
          mkdir -p ${ARTIFACTS}
          cabal install --install-method=copy --installdir="${ARTIFACTS}" -fnightly -fembed_data_files pandoc-cli
          strip "${ARTIFACTS}/pandoc"
          cp COPYRIGHT ${ARTIFACTS}/
          echo "Built from ${GITHUB_SHA}" > ${ARTIFACTS}/README.nightly.txt
    - uses: actions/upload-artifact@v7
      with:
        name: nightly-macos
        path: nightly-macos

