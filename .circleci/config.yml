version: 2.1

# Builds a cache key from every cabal project/package file in the tree.
# Replaces Cirrus's static `fingerprint_key`: CircleCI cache keys are immutable,
# so we key on a checksum that changes when dependencies change, and fall back
# to the newest existing cache when they don't (the partial-key restore below).
commands:
  make_cache_key:
    steps:
      - run:
          name: Compute cabal cache key
          command: |
            find . \( -name '*.cabal' -o -name 'cabal.project*' \) -print0 \
              | sort -z | xargs -0 cat > /tmp/cabal-cache-key 2>/dev/null || true

jobs:
  macos_arm64:
    macos:
      xcode: "16.4.0"          # any GA Xcode image; M4 Pro needs a recent one
    resource_class: m4pro.medium   # 6 vCPU / 28 GB (M1/M2 classes were retired Feb 2026)
    steps:
      - run:
          name: Checkout code
          command: |
            git clone https://github.com/jgm/pandoc .
      - run:
          name: Install GHC + cabal
          command: |
            brew update
            brew install ghc@9.10 cabal-install
      - run:
          name: Put GHC on PATH
          # CircleCI's `environment:` does NOT expand $PATH, so we append at runtime.
          command: echo 'export PATH="/opt/homebrew/opt/ghc@9.10/bin:$PATH"' >> "$BASH_ENV"
      - make_cache_key
      - restore_cache:
          keys:
            - cabal-store-macos-arm64-v3-{{ checksum "/tmp/cabal-cache-key" }}
      - run:
          name: Build dependencies
          no_output_timeout: 90m
          command: |
            cabal update
            cabal build all -fembed_data_files -fhttp -fserver -flua --dependencies-only
      - save_cache:
          key: cabal-store-macos-arm64-v3-{{ checksum "/tmp/cabal-cache-key" }}
          paths:
            - ~/.local/state/cabal
      - run:
          name: Make macOS release
          no_output_timeout: 90m
          command: sh macos/make_macos_release.sh
      - run:
          name: Compress artifacts
          command: |
            tar cvzf macos-arm64.tar.gz macos-arm64
      - store_artifacts:
          path: macos-arm64.tar.gz

  linux_amd64:
    docker:
      - image: quay.io/benz0li/ghc-musl:9.10
    resource_class: large       # 4 vCPU / 8 GB. Bump to `xlarge` (8/16) if GHC OOMs.
    environment:
      CABALOPTS: -f-export-dynamic -fembed_data_files -fhttp -fserver -flua --enable-executable-static -j4
      GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
    steps:
      - run:
          name: Checkout code
          command: |
            git clone https://github.com/jgm/pandoc .
      - make_cache_key
      - restore_cache:
          keys:
            - cabal-store-linux-amd64-v3-{{ checksum "/tmp/cabal-cache-key" }}
      - run:
          name: Build dependencies
          no_output_timeout: 90m
          command: |
            cabal update
            cabal build --dependencies-only $CABALOPTS --ghc-options="$GHCOPTS" pandoc-cli
      - save_cache:
          key: cabal-store-linux-amd64-v3-{{ checksum "/tmp/cabal-cache-key" }}
          paths:
            - ~/.local/state/cabal
      - run:
          name: Package
          no_output_timeout: 90m
          command: |
            cabal freeze && cat cabal.project.freeze
            bash linux/make_artifacts.sh
      - run:
          name: Compress artifacts
          command: |
            tar cvzf linux-amd64.tar.gz linux-amd64
      - store_artifacts:
          path: linux-amd64.tar.gz

  linux_arm64:
    docker:
      - image: quay.io/benz0li/ghc-musl:9.10
    resource_class: arm.large   # 4 vCPU / 16 GB
    environment:
      CABALOPTS: -f-export-dynamic -fembed_data_files -fhttp -fserver -flua --enable-executable-static -j4
      GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
    steps:
      - run:
          name: Checkout code
          command: |
            git clone https://github.com/jgm/pandoc .
      - make_cache_key
      - restore_cache:
          keys:
            - cabal-store-linux-arm64-v3-{{ checksum "/tmp/cabal-cache-key" }}
      - run:
          name: Build dependencies
          no_output_timeout: 90m
          command: |
            cabal update
            cabal build --dependencies-only $CABALOPTS --ghc-options="$GHCOPTS" pandoc-cli
      - save_cache:
          key: cabal-store-linux-arm64-v3-{{ checksum "/tmp/cabal-cache-key" }}
          paths:
            - ~/.local/state/cabal
      - run:
          name: Package
          no_output_timeout: 90m
          command: |
            bash linux/make_artifacts.sh
            cabal freeze && cat cabal.project.freeze
      - run:
          name: Compress artifacts
          command: |
            tar cvzf linux-arm64.tar.gz linux-arm64
      - store_artifacts:
          path: linux-arm64.tar.gz

  # The wasm build is split over two jobs, each with its own time limit:
  # wasm_deps builds the dependencies into the cabal store, which is passed
  # to wasm through the cache; wasm builds, optimizes, and packages pandoc.
  #
  # These jobs don't use `nix develop`: that shell includes a native Haskell
  # environment that may need to be built from source.  The wasm build only
  # needs the prebuilt ghc-wasm-meta toolchain, so we use `nix shell` with
  # the versions pinned in flake.lock (--inputs-from also makes `nixpkgs`
  # refer to the pinned nixpkgs).
  wasm_deps:
    docker:
      - image: nixos/nix:2.32.8
    resource_class: arm.large   # 4 vCPU / 16 GB
    environment:
      # `nix shell` is a flakes command, so enable flakes. The sandbox must be
      # off because CircleCI's container isn't privileged enough to set it up.
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    steps:
      - run:
          name: Checkout code
          command: |
            git clone https://github.com/jgm/pandoc .
            mkdir -p /tmp/workspace
            git rev-parse HEAD > /tmp/workspace/wasm-commit
      - make_cache_key
      - restore_cache:
          keys:
            - cabal-store-linux-wasm-v4-{{ checksum "/tmp/cabal-cache-key" }}
      # gnupatch is for the post-checkout-commands in cabal.project.
      - run:
          name: Build dependencies
          no_output_timeout: 60m
          command: |
            nix shell --inputs-from . ghc-wasm-meta nixpkgs#gnupatch --command \
              bash -c "wasm32-wasi-cabal update &&
                       wasm32-wasi-cabal build --dependencies-only pandoc"
      # wasm32-wasi-cabal uses $HOME/.ghc-wasm/.cabal as its CABAL_DIR.
      - save_cache:
          key: cabal-store-linux-wasm-v4-{{ checksum "/tmp/cabal-cache-key" }}
          paths:
            - ~/.ghc-wasm/.cabal/store
      # So that wasm builds the same commit, even if main has moved on.
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - wasm-commit

  wasm:
    docker:
      - image: nixos/nix:2.32.8
    resource_class: arm.large   # 4 vCPU / 16 GB
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Checkout code
          command: |
            git clone https://github.com/jgm/pandoc .
            git checkout "$(cat /tmp/workspace/wasm-commit)"
      - make_cache_key
      - restore_cache:
          keys:
            - cabal-store-linux-wasm-v4-{{ checksum "/tmp/cabal-cache-key" }}
      # make also optimizes the result with wasm-opt, from ghc-wasm-meta.
      - run:
          name: Build pandoc.wasm
          no_output_timeout: 60m
          command: |
            nix shell --inputs-from . ghc-wasm-meta nixpkgs#gnumake nixpkgs#gnupatch \
              --command bash -c "make pandoc.wasm"
      - run:
          name: Compress artifacts
          command: |
            mkdir pandoc-wasm
            mv pandoc.wasm COPYING.md COPYRIGHT pandoc-wasm/
            nix shell --inputs-from . nixpkgs#zip \
              --command zip -r pandoc.wasm.zip pandoc-wasm
      - store_artifacts:
          path: pandoc.wasm.zip

workflows:
  release:
    jobs:
      - macos_arm64
      - linux_amd64
      - linux_arm64
      - wasm_deps
      - wasm:
          requires:
            - wasm_deps
