flags:
  pandoc:
    embed_data_files: true
  QuickCheck:
    old-random: false
allow-newer: true
allow-newer-deps:
  # This needs zip-archive 0.5
  - hslua-module-zip
  # These need to allow doclayout 0.6
  - gridtables
  - hslua-module-doclayout
packages:
- '.'
- 'pandoc-cli'
- 'pandoc-lua-engine'
- 'pandoc-server'
extra-deps:
- hslua-2.5.0
- hslua-module-doclayout-1.2.1.1
- hslua-module-path-1.2.0
- hslua-module-text-1.2.0
- hslua-module-system-1.3.0
- hslua-module-version-1.2.0.1
- hslua-module-zip-1.2.1
- hslua-objectorientation-2.5.0
- hslua-packaging-2.4.1
- hslua-typing-0.2.0
- skylighting-format-blaze-html-0.1.2.2
- skylighting-0.15
- skylighting-core-0.15
- typst-symbols-0.3
- zip-archive-0.5
- doclayout-0.6
- doctemplates-0.11.1
- asciidoc-0.1.1.1
- commonmark-pandoc-0.3.0.2
- commonmark-extensions-0.2.7.3
- djot-0.1.4.3
- yamlet-1.0.0.1
- yamlet-aeson-1.0.0.1
# yamlet and yamlet-aeson need newer versions than the snapshot has:
- aeson-2.2.5.1
- scientific-0.3.9.0
- text-iso8601-0.1.1.2
- gridtables-0.1.1.1
- citeproc-0.14.1.1
- texmath-0.13.3.3
- git: https://github.com/jgm/commonmark-hs.git
  commit: 89b2686bbc77aba333a79790e39cb08b90c1d75d
  subdirs: [commonmark]
- git: https://github.com/jgm/typst-hs.git
  commit: c5548ce803657545a9672e919d5b9a8a805ed8f1
# needed for crypton:
- crypton-2.2.6
- crypton-x509-1.10.1
- crypton-x509-validation-1.10.1
- crypton-x509-store-1.10.0
- crypton-x509-system-1.10.0
- crypton-asn1-encoding-0.10.0
- crypton-asn1-types-0.4.1
- crypton-asn1-parse-0.10.0
- crypton-connection-0.4.6
- time-hourglass-0.3.0
- tls-session-manager-0.1.2
- crypto-token-0.2.1
- http-client-tls-0.4.0
- tls-2.4.14
- ram-0.22.1
- hpke-0.4.0
- ech-config-0.0.2
# needed because not yet in nixpkgs:
- pandoc-types-1.23.1.2
# needed because not yet in nixpkgs:
- git: https://github.com/jgm/emojis.git
  commit: eb7776592b48e6f7137c63bcecd14d20445648f5
ghc-options:
   "$locals": -fhide-source-paths -Wno-missing-home-modules
resolver: lts-24.51
nix:
  packages:
  - pkg-config
  - zlib
