flags:
  pandoc:
    embed_data_files: true
  QuickCheck:
    old-random: false
packages:
- '.'
- 'pandoc-cli'
- 'pandoc-lua-engine'
- 'pandoc-server'
extra-deps:
- hslua-2.5.0
- hslua-aeson-2.3.2.1
- hslua-module-doclayout-1.2.1.1
- hslua-module-path-1.2.0
- hslua-module-text-1.2.0
- hslua-module-system-1.3.0
- hslua-module-version-1.2.0.1
- hslua-module-zip-1.2.1
- hslua-objectorientation-2.5.0
- hslua-packaging-2.4.1
- hslua-typing-0.2.0
- pandoc-lua-marshal-0.3.3
- skylighting-0.15.0.1
- skylighting-core-0.15.0.1
- typst-symbols-0.3
- zip-archive-0.5
- doclayout-0.6
- asciidoc-0.1.1.1
- commonmark-pandoc-0.3.0.2
- yamlet-1.0.0.1
- yamlet-aeson-1.0.0.1
- texmath-0.13.3.5
- citeproc-0.14.2
- typst-0.12.1
- commonmark-0.3.2
- commonmark-extensions-0.2.8
# needed because not yet in nixpkgs:
- pandoc-types-1.23.1.2
- doctemplates-0.11.1
- gridtables-0.1.1.1
- djot-0.1.4.3
- emojis-0.1.6
ghc-options:
   "$locals": -fhide-source-paths -Wno-missing-home-modules
resolver: lts-24.66
nix:
  packages:
  - pkg-config
  - zlib
